services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: change-root-password
      MYSQL_DATABASE: veloces
    volumes:
      - mysql_data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      - "3306:3306"
  app:
    build: .
    restart: unless-stopped
    depends_on:
      - db
    environment:
      PORT: 3000
      JWT_SECRET: change-this-secret
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: change-root-password
      DB_NAME: veloces
      HOD_EMAIL: malay8200481@gmail.com
    ports:
      - "3000:3000"
volumes:
  mysql_data:
